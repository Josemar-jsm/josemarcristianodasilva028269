<div class="min-h-screen bg-slate-100 flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white p-6 hidden md:block">
    <div class="text-2xl font-bold">PSS</div>

    <div class="mt-4 text-sm text-white/80" *ngIf="(state$ | async) as s">
      <div>Usuário: <span class="text-white">{{ s.username || '-' }}</span></div>
      <div>Roles: <span class="text-white">{{ (s.roles || []).join(', ') || '-' }}</span></div>
    </div>

    <nav class="mt-8 space-y-2">
      <a
        class="block px-3 py-2 rounded hover:bg-white/10"
        routerLink="/albums"
        routerLinkActive="bg-white/10 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Álbuns
      </a>

      <a
        class="block px-3 py-2 rounded hover:bg-white/10"
        routerLink="/artists"
        routerLinkActive="bg-white/10 font-semibold"
      >
        Artistas
      </a>

      <ng-container *ngIf="(state$ | async) as s">
        <a
          *ngIf="hasRole('ROLE_ADMIN', s.roles)"
          class="block px-3 py-2 rounded hover:bg-white/10"
          routerLink="/admin"
          routerLinkActive="bg-white/10 font-semibold"
        >
          Admin
        </a>
      </ng-container>

      <button
        class="mt-6 w-full px-3 py-2 rounded bg-red-600 hover:bg-red-700 text-white text-sm"
        (click)="logout()"
      >
        Sair
      </button>
    </nav>
  </aside>

  <!-- Mobile top bar -->
  <header class="md:hidden w-full bg-slate-900 text-white p-4 flex items-center justify-between">
    <div class="font-bold">PSS</div>
    <div class="flex gap-3 text-sm">
      <a routerLink="/albums" routerLinkActive="underline">Álbuns</a>
      <a routerLink="/artists" routerLinkActive="underline">Artistas</a>
      <a routerLink="/admin" routerLinkActive="underline">Admin</a>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 p-4 md:p-8">
    <router-outlet></router-outlet>
  </main>
</div>
