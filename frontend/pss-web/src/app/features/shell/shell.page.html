<div class="min-h-screen bg-slate-100 flex flex-col md:flex-row">

  <!-- Mobile Top Bar -->
  <header class="md:hidden sticky top-0 z-50 w-full bg-slate-900 text-white p-4 flex items-center justify-between shadow-md">
    <div class="font-bold text-xl tracking-wider text-blue-400">Tambor de Cururu</div>
    <nav class="flex gap-4 text-xs font-medium uppercase tracking-tighter">
      <a routerLink="/albums" routerLinkActive="text-blue-400">Álbuns</a>
      <a routerLink="/artists" routerLinkActive="text-blue-400">Artistas</a>
      <button (click)="logout()" class="text-red-400 font-bold">Sair</button>
    </nav>
  </header>

  <!-- Sidebar (Desktop) -->
  <aside class="w-64 bg-slate-900 text-white p-6 hidden md:flex flex-col h-screen sticky top-0 shadow-2xl">
    <div class="mb-8">
      <div class="text-3xl font-extrabold tracking-tight text-blue-500">Tambor de Cururu</div>

      <div class="mt-6 p-4 rounded-xl bg-white/5 border border-white/10" *ngIf="(state$ | async) as s">
        <p class="text-[10px] uppercase font-bold text-slate-500 mb-1">Logado como</p>
        <div class="truncate font-medium text-sm text-slate-100">{{ s.username || 'Visitante' }}</div>
        <div class="flex flex-wrap gap-1 mt-2">
          <span *ngFor="let role of s.roles" class="text-[9px] bg-blue-500/20 text-blue-300 px-1.5 py-0.5 rounded border border-blue-500/30">
            {{ role.replace('ROLE_', '') }}
          </span>
        </div>
      </div>
    </div>

    <nav class="flex-1 space-y-1">
      <a class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-white/10" routerLink="/albums" routerLinkActive="bg-blue-600 text-white shadow-lg">
        <span class="font-medium">Álbuns</span>
      </a>
      <a class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-white/10" routerLink="/artists" routerLinkActive="bg-blue-600 text-white shadow-lg">
        <span class="font-medium">Artistas</span>
      </a>

      <ng-container *ngIf="(state$ | async) as s">
        <a *ngIf="hasRole('ROLE_ADMIN', s.roles)" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-white/10 border-t border-white/5 mt-4 pt-4" routerLink="/admin" routerLinkActive="bg-amber-600">
          <span class="font-medium text-amber-400">Admin</span>
        </a>
      </ng-container>
    </nav>

    <div class="pt-6 border-t border-white/10">
      <button (click)="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white transition-all font-bold text-sm">
        Sair da Conta
      </button>
    </div>
  </aside>

  <main class="flex-1 p-4 md:p-10 lg:p-12 overflow-y-auto relative">
    <app-toast-center></app-toast-center>

    <div class="max-w-7xl mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
