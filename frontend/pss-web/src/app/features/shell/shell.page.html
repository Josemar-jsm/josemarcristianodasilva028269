<div class="min-h-screen bg-gray-100">

  <!-- Topbar mobile -->
  <header class="md:hidden bg-gray-900 text-white px-4 py-3 flex items-center justify-between">
    <div class="font-bold">PSS</div>
    <button (click)="logout()" class="text-sm px-3 py-1 rounded bg-red-500">
      Sair
    </button>
  </header>

  <div class="flex">

    <!-- Sidebar desktop -->
    <aside class="hidden md:flex md:flex-col w-64 bg-gray-900 text-white min-h-screen p-4">
      <div class="text-2xl font-bold mb-6">PSS</div>

      <div class="text-sm text-gray-300 mb-4">
        <div>Usuário: <span class="text-white">{{ username$ | async }}</span></div>
        <div>Roles: <span class="text-white">{{ (roles$ | async)?.join(', ') || '(nenhuma)' }}</span></div>
      </div>

      <nav class="flex flex-col gap-2">
        <a routerLink="/albums"
           routerLinkActive="bg-gray-800"
           class="px-3 py-2 rounded hover:bg-gray-800">
          Álbuns
        </a>

        <a routerLink="/artists"
           routerLinkActive="bg-gray-800"
           class="px-3 py-2 rounded hover:bg-gray-800">
          Artistas
        </a>

        <a *ngIf="(roles$ | async)?.includes('ROLE_ADMIN')"
           routerLink="/admin"
           routerLinkActive="bg-gray-800"
           class="px-3 py-2 rounded hover:bg-gray-800">
          Admin
        </a>
      </nav>

      <div class="mt-auto pt-6">
        <button (click)="logout()" class="w-full px-3 py-2 rounded bg-red-500 hover:bg-red-600">
          Sair
        </button>
      </div>
    </aside>

    <!-- Content -->
    <main class="flex-1 p-4 md:p-8">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
