server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pss-api
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:${DB_HOST}}:${DB_PORT:5432}/${DB_NAME:pss}
    username: ${DB_USER:pss}
    password: ${DB_PASS:pss}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Cuiaba

# Configs da aplicação
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  upload:
    max-bytes: ${UPLOAD_MAX_BYTES:5242880} # 5MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://storage-pss-dev-v1:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio12345}
  bucket: ${MINIO_BUCKET:albums}
  presign-expiry-minutes: ${MINIO_PRESIGN_EXPIRY_MINUTES:30}

jwt:
  issuer: ${JWT_ISSUER:pss-mt}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:300}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
  packages-to-scan: br.com
  paths-to-match: /v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
  server:
    port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web: INFO
