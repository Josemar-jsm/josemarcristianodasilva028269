services:
  db-pss-dev-v1:
    image: postgres:16-alpine
    container_name: db-pss-dev-v1
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata-pss-dev-v1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-pss-dev-v1:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: storage-pss-dev-v1
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata-pss-dev-v1:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init-pss-dev-v1:
    image: minio/mc:latest
    container_name: storage-init-pss-dev-v1
    env_file:
      - .env
    depends_on:
      storage-pss-dev-v1:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local ${MINIO_ENDPOINT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET} || true;
      mc anonymous set download local/${MINIO_BUCKET} || true;
      echo 'MinIO bucket ready';
      "

  api-pss-dev-v1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-pss-dev-v1
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker  
    ports:
      - "8080:8080"
    depends_on:
      db-pss-dev-v1:
        condition: service_healthy
      storage-pss-dev-v1:
        condition: service_healthy

  web-pss-dev-v1:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-pss-dev-v1
    ports:
      - "4200:80"
    depends_on:
      - api-pss-dev-v1

volumes:
  pgdata-pss-dev-v1:
  miniodata-pss-dev-v1:

