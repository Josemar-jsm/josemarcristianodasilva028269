services:
  db-pss-dev-v1:
    image: postgres:16-alpine
    container_name: db-pss-dev-v1
    environment:
      POSTGRES_DB: pss
      POSTGRES_USER: pss
      POSTGRES_PASSWORD: pss
    ports:
      - "5432:5432"
    volumes:
      - pgdata-pss-dev-v1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pss -d pss"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-pss-dev-v1:
    image: minio/minio:RELEASE.2025-01-20T00-00-00Z
    container_name: storage-pss-dev-v1
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata-pss-dev-v1:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:9000/minio/health/ready >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init-pss-dev-v1:
    image: minio/mc:RELEASE.2025-01-17T00-00-00Z
    container_name: storage-init-pss-dev-v1
    depends_on:
      storage-pss-dev-v1:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage-pss-dev-v1:9000 minio minio12345;
      mc mb -p local/albums || true;
      mc anonymous set download local/albums || true;
      echo 'MinIO bucket ready';
      "

  api-pss-dev-v1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-pss-dev-v1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db-pss-dev-v1
      DB_PORT: 5432
      DB_NAME: pss
      DB_USER: pss
      DB_PASS: pss

      MINIO_ENDPOINT: http://storage-pss-dev-v1:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: albums

      JWT_ISSUER: pss-mt
      JWT_ACCESS_TTL_SECONDS: 300
      JWT_REFRESH_TTL_SECONDS: 86400
    ports:
      - "8080:8080"
    depends_on:
      db-pss-dev-v1:
        condition: service_healthy
      storage-pss-dev-v1:
        condition: service_healthy

  web-pss-dev-v1:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-pss-dev-v1
    ports:
      - "4200:80"
    depends_on:
      - api-pss-dev-v1

volumes:
  pgdata-pss-dev-v1:
  miniodata-pss-dev-v1:

